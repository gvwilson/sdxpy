<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="$lang$" xml:lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>$if(heading)$$heading$$else$$pagetitle$$endif$</title>
$for(css)$
  <link rel="stylesheet" href="$css$" />
$endfor$
$header-includes$
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body>
<header class="topbar">
  <nav class="topnav">
    <a class="topnav-item" href="$home$">Home</a>
    <details class="topnav-dropdown">
      <summary class="topnav-item">Chapters</summary>
      <div class="topnav-menu">$chapters$</div>
    </details>
    <details class="topnav-dropdown">
      <summary class="topnav-item">Appendices</summary>
      <div class="topnav-menu">$appendices$</div>
    </details>
$if(toc)$
    <details class="topnav-dropdown">
      <summary class="topnav-item">Contents</summary>
      <div class="topnav-menu">$toc$</div>
    </details>
$else$
    <span class="topnav-item disabled">Contents</span>
$endif$
$if(source)$
    <a class="topnav-item source" href="$source$">Source</a>
$endif$
  </nav>
</header>
<main class="content">
$body$
</main>
<footer class="page-footer">
  <nav class="pager">
    $if(prev)$$prev$$endif$
    $if(next)$$next$$endif$
  </nav>
</footer>
<script>
document.addEventListener('click', function (e) {
  var link = e.target.closest && e.target.closest('a');
  document.querySelectorAll('details.topnav-dropdown[open]').forEach(function (d) {
    if (!d.contains(e.target) || (link && d.contains(link))) d.removeAttribute('open');
  });
});
</script>
</body>
</html>
