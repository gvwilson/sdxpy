# Shared definitions for Mccole Quarto projects.
# Include in the project's _quarto.yml with:
#
#     metadata-files:
#       - mccole/mccole.yml


project:
  type: book
  output-dir: docs

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua
  - mccole/nav.lua

shortcodes:
  - mccole/exercise.lua
  - mccole/fixme.lua
  - mccole/glossary.lua
  - mccole/i.lua
  - mccole/inc.lua
  - mccole/inc-noh1.lua
  - mccole/issue.lua
  - mccole/linecount.lua

format:
  html:
    minimal: true
    template: mccole/theme.html
    css: mccole/mccole-book.css
    link-citations: true
    search: false
    toc: true
    toc-depth: 2
  pdf:
    documentclass: scrbook
