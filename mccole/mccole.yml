# Shared definitions for Mccole Quarto projects.
# Include in the project's _quarto.yml with:
#
#     metadata-files:
#       - mccole/mccole.yml


project:
  type: book
  output-dir: docs

bibliography: bibliography/references.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua
  - mccole/nav.lua
  - mccole/remove-empty-h1.lua
  - mccole/forma.lua

shortcodes:
  - mccole/exercise.lua
  - mccole/fixme.lua
  - mccole/glossary.lua
  - mccole/i.lua
  - mccole/inc-quarto.lua
  - mccole/inc-noh1.lua
  - mccole/issue.lua
  - mccole/linecount.lua

format:
  html:
    minimal: true
    template: mccole/theme.html
    css:
      - mccole/mccole.css
      - mccole/mccole-book.css
      - mccole/tango.css
    highlight-style: tango
    link-citations: true
    search: false
    toc: true
    toc-depth: 2
    html-math-method: mathjax
  pdf:
    documentclass: scrbook
